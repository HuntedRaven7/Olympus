---
name: Build Apollo
permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

on:
  push:
    branches: [main]
    paths: ["images/apollo/**", "images/hera/**", ".github/workflows/**", "Justfile"]
  pull_request:
    branches: [main]
    paths: ["images/apollo/**", "images/hera/**", ".github/workflows/**", "Justfile"]
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-restore:
    uses: ./.github/workflows/reusable-pacman-cache.yml
    with:
      mode: restore
      cache-key: apollo-amd64

  build:
    needs: cache-restore
    uses: ./.github/workflows/reusable-bootc-build.yml
    secrets: inherit
    with:
      image-name: apollo
      base-image: ghcr.io/huntedraven7/hera:latest
      cache-key: apollo-amd64
      sealed: false
      publish: ${{ github.event_name != 'pull_request' }}

  cache-save:
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/reusable-pacman-cache.yml
    with:
      mode: save
      cache-key: apollo-amd64

  boot-test:
    needs: [build, cache-restore]
    uses: ./.github/workflows/reusable-boot-test.yml
    with:
      image-name: apollo
      cache-key: apollo-amd64
