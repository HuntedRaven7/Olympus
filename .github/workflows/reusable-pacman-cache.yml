---
name: Pacman cache
# Reusable pacman cache for Olympus image builds.
#
# A workflow_call job cannot share its workspace with the caller's job, so the
# cache is carried between jobs as a single tarball artifact:
#   1. call this workflow with mode=restore  -> uploads "pacman-cache-<key>"
#   2. in the build job, download and extract it into .cache/pacman, then build
#   3. tar the updated .cache/pacman and upload "pacman-cache-updated-<key>"
#   4. call this workflow with mode=save -> extracts the tarball and saves it
#
# A tarball avoids upload-artifact rejecting Arch package filenames that
# contain an epoch colon (e.g. avahi-1:0.9rc5-2-x86_64.pkg.tar.zst).
on:
  workflow_call:
    inputs:
      mode:
        description: "restore or save"
        required: true
        type: string
      cache-key:
        description: "Base key for the cache (image name + runner arch)"
        required: true
        type: string
      cache-path:
        description: "Path cached inside the job workspace"
        required: false
        type: string
        default: ".cache/pacman"

permissions:
  actions: read
  contents: read

jobs:
  pacman-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore pacman cache
        if: inputs.mode == 'restore'
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.4
        with:
          path: ${{ inputs.cache-path }}
          key: pacman-${{ inputs.cache-key }}
          restore-keys: |
            pacman-${{ inputs.cache-key }}-
            pacman-

      - name: Pack restored cache
        if: inputs.mode == 'restore'
        run: |
          mkdir -p "${{ inputs.cache-path }}"
          touch "${{ inputs.cache-path }}/olympus-cache.marker"
          tar -czf pacman-cache.tar.gz -C "${{ inputs.cache-path }}" .

      - name: Upload restored cache to the build job
        if: inputs.mode == 'restore'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: pacman-cache-${{ inputs.cache-key }}
          path: pacman-cache.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Download updated cache from the build job
        if: inputs.mode == 'save'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4.3.0
        with:
          name: pacman-cache-updated-${{ inputs.cache-key }}
          path: pacman-cache-updated
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack updated cache
        if: inputs.mode == 'save'
        run: |
          mkdir -p "${{ inputs.cache-path }}"
          tar -xzf pacman-cache-updated/pacman-cache.tar.gz -C "${{ inputs.cache-path }}"

      - name: Save pacman cache
        if: inputs.mode == 'save'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.2.4
        with:
          path: ${{ inputs.cache-path }}
          key: pacman-${{ inputs.cache-key }}
