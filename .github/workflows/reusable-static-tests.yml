---
name: Static tests
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: shellcheck / actionlint / config assertions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint jq python3

      - name: Install actionlint
        run: |
          curl --no-progress-meter -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o /tmp/actionlint.tar.gz
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      - name: Run static tests
        run: ./tests/static/run.sh

      - name: Check upstream drift pins are valid
        uses: ./.github/actions/upstream-drift
        with:
          check-only: "true"
