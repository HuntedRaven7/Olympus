apiVersion: v1
kind: Namespace
metadata:
  name: kubestellar-console
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 8080
          protocol: TCP
