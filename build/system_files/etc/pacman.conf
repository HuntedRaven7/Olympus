# /etc/pacman.conf
[options]
HoldPkg     = pacman glibc
Architecture = auto
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
# No kernel landlock in containerd
DisableSandbox
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[options]
